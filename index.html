<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRCSN.Co Shop - Precision Clothing</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --black:#0a0a0a;
  --dark-gray:#1c1c1c;
  --gray:#aaaaaa;
  --white:#ffffff;
  --accent:#f0f0f0;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Poppins","Arial",sans-serif;
}

body{
  background:var(--black);
  color:var(--white);
  line-height:1.6;
  opacity:0;
  transition:opacity 0.8s ease;
}
body.loaded{opacity:1;}

/* LOADER */
.loader{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:2000;
}
.loader h1{
  letter-spacing:4px;
  animation:pulse 1.5s infinite alternate;
}
@keyframes pulse{
  from{opacity:0.4;}
  to{opacity:1;}
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  background:var(--dark-gray);
  display:flex;
  align-items:center;
  padding:15px 20px;
  z-index:1000;
}
.hamburger{
  width:24px;
  height:18px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
  margin-right:15px;
}
.hamburger span{
  height:2px;
  background:white;
}
.logo{
  letter-spacing:2px;
  font-size:1rem;
}

.nav-links{
  position:fixed;
  top:0;
  left:-250px;
  width:220px;
  height:100%;
  background:var(--dark-gray);
  padding-top:80px;
  padding-left:25px;
  display:flex;
  flex-direction:column;
  gap:25px;
  transition:0.4s ease;
}
.nav-links.active{left:0;}
.nav-links a{
  text-transform:uppercase;
  cursor:pointer;
}

/* HERO */
header.hero{
  text-align:center;
  padding:130px 20px 70px;
}
header.hero h1{
  font-size:2.5rem;
  letter-spacing:3px;
}
header.hero p{
  margin:15px 0 25px;
  font-family:"Dancing Script",cursive;
  color:var(--gray);
}
header.hero button{
  padding:12px 30px;
  border:none;
  border-radius:40px;
  background:var(--accent);
  cursor:pointer;
}

/* SECTION */
section{
  padding:70px 20px;
  text-align:center;
}
h2{
  margin-bottom:40px;
  font-size:1.8rem;
}

/* NEW RELEASE (balanced size) */
.showcase-card{
  background:var(--dark-gray);
  padding:20px;
  border-radius:15px;
  width:100%;
  max-width:320px;
  margin:0 auto 50px;
  animation:glow 2s infinite alternate;
  cursor:pointer;
  transition:0.3s ease;
}
@keyframes glow{
  from{box-shadow:0 0 10px rgba(255,255,255,0.2);}
  to{box-shadow:0 0 25px rgba(255,255,255,0.6);}
}
.badge{
  background:#ff3b3b;
  padding:4px 10px;
  border-radius:20px;
  font-size:0.7rem;
  display:inline-block;
  margin-bottom:8px;
}
.showcase-card img{
  width:100%;
  border-radius:10px;
  margin-bottom:12px;
}

/* COLLECTION GRID */
.collections-grid{
  display:grid;
  gap:20px;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  max-width:1000px;
  margin:0 auto;
}

.product-card{
  background:var(--dark-gray);
  padding:15px;
  border-radius:12px;
  cursor:pointer;
  transition:0.3s ease;
}
.product-card:hover{
  transform:scale(1.05);
}
.product-card img{
  width:100%;
  border-radius:8px;
  margin-bottom:10px;
}
.product-card h3{
  font-size:0.9rem;
}
.product-card p{
  font-size:0.85rem;
  color:var(--gray);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:0.4s ease;
  z-index:3000;
  padding:20px;
}
.modal.active{
  opacity:1;
  pointer-events:auto;
}
.modal img{
  width:100%;
  max-width:350px;
  max-height:50vh;
  border-radius:12px;
  margin-bottom:20px;
}
.close-modal{
  position:absolute;
  top:20px;
  right:25px;
  font-size:1.8rem;
  cursor:pointer;
}

.sizes{
  display:flex;
  gap:10px;
  margin:15px 0;
  flex-wrap:wrap;
  justify-content:center;
}
.size-option{
  padding:8px 15px;
  border:1px solid white;
  cursor:pointer;
  transition:0.3s;
}
.size-option.active,
.size-option:hover{
  background:white;
  color:black;
}

.modal button{
  padding:10px 25px;
  border:none;
  background:var(--accent);
  cursor:pointer;
  margin-top:15px;
}

footer{
  text-align:center;
  padding:20px;
  background:#111;
  color:#777;
}

/* RESPONSIVE TWEAKS */
@media (min-width:768px){

  header.hero h1{
    font-size:3rem;
  }

  .showcase-card{
    max-width:350px;
  }

  .collections-grid{
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  }

}
</style>
</head>
<body>

<div class="loader" id="loader">
  <h1>PRCSN.Co</h1>
</div>

<nav>
  <div class="hamburger" id="hamburger">
    <span></span><span></span><span></span>
  </div>
  <div class="logo">PRCSN.Co Shop</div>
</nav>

<div class="nav-links" id="nav-links">
  <a onclick="scrollToSection('new')">New Release</a>
  <a onclick="scrollToSection('collections')">Collections</a>
  <a onclick="scrollToSection('contact')">Contact</a>
</div>

<header class="hero">
  <h1>PRECISION</h1>
  <p>Crafted with Accuracy</p>
  <button onclick="scrollToSection('new')">Shop Now</button>
</header>

<section id="new">
  <h2>New Release</h2>
  <div class="showcase-card" onclick="openModal('images/tshirt1.png','Black Minimalist Tee','$25')">
    <div class="badge">🔥 NEW DROP</div>
    <img src="images/tshirt1.png">
    <h3>Black Minimalist Tee</h3>
    <p>$25</p>
  </div>
</section>

<section id="collections">
  <h2>All Collections</h2>
  <div class="collections-grid">

    <!-- Shirts 2–7 here same as before -->

  </div>
</section>

<footer>© 2026 PRCSN.Co. All rights reserved.</footer>

<div class="modal" id="modal">
  <div class="close-modal" onclick="closeModal()">✕</div>
  <img id="modal-img">
  <h3 id="modal-title"></h3>
  <p id="modal-price"></p>

  <div class="sizes">
    <div class="size-option" onclick="selectSize(this)">S</div>
    <div class="size-option" onclick="selectSize(this)">M</div>
    <div class="size-option" onclick="selectSize(this)">L</div>
    <div class="size-option" onclick="selectSize(this)">XL</div>
  </div>

  <button>Buy Now</button>
</div>

<script>
window.addEventListener("load",()=>{
  document.body.classList.add("loaded");
  document.getElementById("loader").style.display="none";
});

const hamburger=document.getElementById("hamburger");
const navLinks=document.getElementById("nav-links");
hamburger.addEventListener("click",()=>{
  navLinks.classList.toggle("active");
});

function scrollToSection(id){
  document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

function openModal(img,title,price){
  document.getElementById("modal-img").src=img;
  document.getElementById("modal-title").innerText=title;
  document.getElementById("modal-price").innerText=price;
  document.getElementById("modal").classList.add("active");
}

function closeModal(){
  document.getElementById("modal").classList.remove("active");
}

function selectSize(element){
  document.querySelectorAll(".size-option").forEach(el=>el.classList.remove("active"));
  element.classList.add("active");
}
</script>

</body>
</html>
