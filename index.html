<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRCSN.Co Shop - Precision Clothing</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --black:#0a0a0a;
  --dark:#141414;
  --gray:#999;
  --white:#fff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Montserrat",sans-serif;
}

body{
  background:linear-gradient(to bottom,#0a0a0a,#111);
  color:white;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  z-index:1000;
}

.logo{font-weight:800;letter-spacing:2px;}

.cart{
  cursor:pointer;
}

#cart-count{
  background:white;
  color:black;
  padding:2px 8px;
  border-radius:50px;
  font-size:0.8rem;
  margin-left:5px;
}

/* HERO WITH VIDEO */
.hero{
  position:relative;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  overflow:hidden;
}

.hero video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  top:0;
  left:0;
  z-index:-1;
  opacity:0.4;
}

.hero h1{
  font-size:3rem;
  letter-spacing:4px;
}

.hero button{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  cursor:pointer;
}

/* PRODUCTS */
section{
  padding:100px 20px;
  text-align:center;
}

.collections-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:30px;
  margin-top:40px;
}

.product-card{
  background:var(--dark);
  padding:20px;
  border-radius:12px;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
}

.product-card:hover{
  transform:translateY(-5px);
}

.product-card img{
  width:100%;
  border-radius:10px;
  transition:0.4s;
}

.product-card img.back{
  position:absolute;
  top:20px;
  left:20px;
  opacity:0;
}

.product-card:hover img.back{
  opacity:1;
}

.product-card:hover img.front{
  opacity:0;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  padding:20px;
  text-align:center;
}

.modal.active{
  opacity:1;
  pointer-events:auto;
}

.modal img{
  max-width:300px;
  border-radius:10px;
}

.close{
  position:absolute;
  top:20px;
  right:30px;
  font-size:2rem;
  cursor:pointer;
}

.sizes{
  display:flex;
  gap:10px;
  margin:15px 0;
}

.size{
  border:1px solid white;
  padding:8px 15px;
  cursor:pointer;
}

.size.active,
.size:hover{
  background:white;
  color:black;
}

.modal button{
  padding:10px 25px;
  border:none;
  cursor:pointer;
  margin-top:10px;
}

/* CART PANEL */
.cart-panel{
  position:fixed;
  right:-400px;
  top:0;
  width:350px;
  height:100%;
  background:#111;
  padding:20px;
  transition:0.4s;
  overflow:auto;
  z-index:2000;
}

.cart-panel.active{
  right:0;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  margin:15px 0;
  border-bottom:1px solid #333;
  padding-bottom:10px;
}

.total{
  margin-top:20px;
  font-weight:600;
}
</style>
</head>
<body>

<nav>
  <div class="logo">PRCSN.Co</div>
  <div class="cart" onclick="toggleCart()">
    🛒 <span id="cart-count">0</span>
  </div>
</nav>

<header class="hero">
  <video autoplay muted loop>
    <source src="video.mp4" type="video/mp4">
  </video>
  <div>
    <h1>PRECISION</h1>
    <button onclick="scrollToProducts()">Shop Now</button>
  </div>
</header>

<section id="products">
  <h2>Collection</h2>
  <div class="collections-grid">

    <div class="product-card" onclick="openModal('images/tshirt1.png','Black Minimalist Tee',25)">
      <img src="images/tshirt1.png" class="front">
      <img src="images/tshirt1-back.png" class="back">
      <h3>Black Minimalist Tee</h3>
      <p>$25</p>
    </div>

    <div class="product-card" onclick="openModal('images/tshirt2.png','Blue Sharp Moves Tee',28)">
      <img src="images/tshirt2.png" class="front">
      <img src="images/tshirt2-back.png" class="back">
      <h3>Blue Sharp Moves Tee</h3>
      <p>$28</p>
    </div>

  </div>
</section>

<!-- PRODUCT MODAL -->
<div class="modal" id="modal">
  <div class="close" onclick="closeModal()">✕</div>
  <img id="modal-img">
  <h3 id="modal-title"></h3>
  <p id="modal-price"></p>

  <p style="color:#aaa;margin-top:10px;">
    Premium 100% cotton. Relaxed fit.<br>
    Model is 6'0 wearing size L.<br>
    Ships in 2-4 business days.
  </p>

  <div class="sizes">
    <div class="size" onclick="selectSize(this)">S</div>
    <div class="size" onclick="selectSize(this)">M</div>
    <div class="size" onclick="selectSize(this)">L</div>
    <div class="size" onclick="selectSize(this)">XL</div>
  </div>

  <button onclick="addToCart()">Add to Cart</button>
</div>

<!-- CART PANEL -->
<div class="cart-panel" id="cart-panel">
  <h2>Your Cart</h2>
  <div id="cart-items"></div>
  <div class="total" id="cart-total"></div>
</div>

<script>
let cart=[];
let selectedSize=null;
let currentProduct=null;

function scrollToProducts(){
  document.getElementById("products").scrollIntoView({behavior:"smooth"});
}

function openModal(img,title,price){
  document.getElementById("modal").classList.add("active");
  document.getElementById("modal-img").src=img;
  document.getElementById("modal-title").innerText=title;
  document.getElementById("modal-price").innerText="$"+price;
  currentProduct={img,title,price};
}

function closeModal(){
  document.getElementById("modal").classList.remove("active");
  selectedSize=null;
  document.querySelectorAll(".size").forEach(s=>s.classList.remove("active"));
}

function selectSize(el){
  document.querySelectorAll(".size").forEach(s=>s.classList.remove("active"));
  el.classList.add("active");
  selectedSize=el.innerText;
}

function addToCart(){
  if(!selectedSize){
    alert("Please select a size");
    return;
  }

  cart.push({...currentProduct,size:selectedSize});
  updateCart();
  closeModal();
}

function updateCart(){
  const cartItems=document.getElementById("cart-items");
  cartItems.innerHTML="";
  let total=0;

  cart.forEach((item,index)=>{
    total+=item.price;
    cartItems.innerHTML+=`
      <div class="cart-item">
        <div>
          ${item.title} (${item.size})<br>$${item.price}
        </div>
        <div onclick="removeItem(${index})" style="cursor:pointer">✕</div>
      </div>
    `;
  });

  document.getElementById("cart-total").innerText="Total: $"+total;
  document.getElementById("cart-count").innerText=cart.length;
}

function removeItem(index){
  cart.splice(index,1);
  updateCart();
}

function toggleCart(){
  document.getElementById("cart-panel").classList.toggle("active");
}
</script>

</body>
</html>
