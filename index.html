<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRECISION - Precision Clothing</title>

<style>
:root {
  --black:#0a0a0a;
  --dark-gray:#1c1c1c;
  --gray:#aaaaaa;
  --white:#ffffff;
  --accent:#f0f0f0;
  --metallic-gradient: linear-gradient(45deg, #f0f0f0, #c0c0c0, #e6e6e6);
  --shadow: 0 4px 15px rgba(0,0,0,0.3);
  --glow:#ffffff;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:"Poppins","Arial",sans-serif;}
body{background:var(--black);color:var(--white);line-height:1.6;}
a{text-decoration:none;color:inherit;cursor:pointer;}

/* NAVIGATION */
nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:300;
  background:var(--dark-gray);
  display:flex;
  align-items:center;
  padding:15px 20px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

/* Hamburger ALWAYS visible */
.hamburger{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  width:24px;
  height:18px;
  cursor:pointer;
  margin-right:15px;
  z-index:400;
}
.hamburger span{
  height:2px;
  width:100%;
  background:var(--white);
}

.logo{
  font-weight:700;
  font-size:1rem;
  letter-spacing:2px;
}

/* SIDE MENU */
.nav-links{
  position:fixed;
  top:0;
  left:-250px;
  height:100%;
  width:220px;
  background:var(--dark-gray);
  display:flex;
  flex-direction:column;
  padding-top:80px;
  padding-left:25px;
  gap:30px;
  transition:0.3s ease;
  z-index:350;
}
.nav-links.active{left:0;}

.nav-links a{
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:1px;
}

/* HERO */
header.hero{
  text-align:center;
  padding:140px 20px 80px;
  background:url('images/hero-background.jpg') center/cover no-repeat;
  position:relative;
}
header.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
}
header.hero h1{
  position:relative;
  font-size:2.8rem;
  letter-spacing:3px;
}
header.hero p{
  position:relative;
  color:var(--gray);
  margin:15px 0 25px;
}
header.hero button{
  position:relative;
  padding:12px 30px;
  border:none;
  border-radius:40px;
  background-image:var(--metallic-gradient);
  font-weight:600;
  cursor:pointer;
}

/* SECTIONS */
section{padding:80px 20px;text-align:center;}
h2{margin-bottom:30px;font-size:2rem;color:var(--accent);}

/* NEW RELEASE GLOWING */
.new-release{
  position:relative;
}

.showcase-card{
  background:var(--dark-gray);
  padding:30px;
  border-radius:15px;
  max-width:400px;
  margin:0 auto;
  box-shadow:0 0 20px rgba(255,255,255,0.15);
  animation: glowPulse 2.5s infinite alternate;
  position:relative;
}

@keyframes glowPulse{
  from{
    box-shadow:0 0 15px rgba(255,255,255,0.2);
  }
  to{
    box-shadow:0 0 35px rgba(255,255,255,0.6);
  }
}

.badge{
  position:absolute;
  top:15px;
  left:15px;
  background:#ff3b3b;
  padding:6px 12px;
  font-size:0.75rem;
  font-weight:700;
  border-radius:20px;
}

.showcase-card img{
  width:100%;
  border-radius:10px;
  margin-bottom:15px;
}

.showcase-card button{
  padding:10px 25px;
  border:none;
  background:var(--accent);
  cursor:pointer;
  border-radius:6px;
  font-weight:600;
}

/* COLLECTIONS */
.carousel{
  display:flex;
  overflow-x:auto;
  gap:20px;
  scroll-snap-type:x mandatory;
}
.carousel::-webkit-scrollbar{display:none;}

.product-card{
  flex:0 0 80%;
  background:var(--dark-gray);
  padding:20px;
  border-radius:12px;
  box-shadow:var(--shadow);
  scroll-snap-align:start;
}

.product-card img{
  width:100%;
  border-radius:8px;
  margin-bottom:15px;
}

.product-card button{
  padding:8px 20px;
  border:none;
  background:var(--accent);
  cursor:pointer;
  border-radius:6px;
}

/* CONTACT */
.contact p{color:var(--gray);margin:5px 0;}

footer{
  text-align:center;
  padding:20px;
  background:var(--dark-gray);
  color:var(--gray);
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="hamburger" id="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <div class="logo">PRECISION</div>
</nav>

<div class="nav-links" id="nav-links">
  <a onclick="scrollToSection('new')">New Release</a>
  <a onclick="scrollToSection('collections')">Collections</a>
  <a onclick="scrollToSection('contact')">Contact</a>
</div>

<!-- HERO -->
<header class="hero">
  <h1>PRECISION</h1>
  <p>Engineered for Precision</p>
  <button onclick="scrollToSection('new')">Shop Now</button>
</header>

<!-- NEW RELEASE -->
<section class="new-release" id="new">
  <h2>New Release</h2>
  <div class="showcase-card">
    <div class="badge">🔥 NEW DROP</div>
    <img src="images/tshirt1.png" alt="Black Minimalist Tee">
    <h3>Black Minimalist Tee</h3>
    <p>$25</p>
    <button>Buy Now</button>
  </div>
</section>

<!-- COLLECTIONS -->
<section id="collections">
  <h2>Collections</h2>
  <div class="carousel">
    <div class="product-card">
      <img src="images/tshirt2.png" alt="Blue Sharp Moves Tee">
      <h3>Blue Sharp Moves Tee</h3>
      <p>$28</p>
      <button>Buy Now</button>
    </div>
    <div class="product-card">
      <img src="images/tshirt3.png" alt="Black Sharp Moves Tee">
      <h3>Black Sharp Moves Tee</h3>
      <p>$30</p>
      <button>Buy Now</button>
    </div>
  </div>
</section>

<!-- CONTACT -->
<section class="contact" id="contact">
  <h2>Contact</h2>
  <p>Email: contact@precision.co</p>
  <p>Instagram: @precision</p>
</section>

<footer>
  © 2026 PRECISION. All rights reserved.
</footer>

<script>
const hamburger = document.getElementById('hamburger');
const navLinks = document.getElementById('nav-links');

hamburger.addEventListener('click', () => {
  navLinks.classList.toggle('active');
});

function scrollToSection(id){
  document.getElementById(id).scrollIntoView({behavior:'smooth'});
  navLinks.classList.remove('active');
}
</script>

</body>
</html>
