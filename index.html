<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRCSN.Co Shop - Precision Clothing</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --black:#0a0a0a;
  --dark:#1a1a1a;
  --white:#fff;
  --gray:#aaa;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Montserrat",sans-serif;
}

body{
  background:linear-gradient(to bottom,#0a0a0a,#111);
  color:white;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  z-index:1000;
}

.logo{font-weight:800;letter-spacing:2px;}

.cart-btn{
  cursor:pointer;
}

#cart-count{
  background:white;
  color:black;
  padding:2px 8px;
  border-radius:20px;
  font-size:0.8rem;
  margin-left:5px;
}

/* HERO VIDEO */
.hero{
  position:relative;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  overflow:hidden;
}

.hero video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0.35;
  z-index:-1;
}

.hero h1{
  font-size:3rem;
  letter-spacing:4px;
}

.hero button{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  cursor:pointer;
}

/* SECTIONS */
section{
  padding:100px 20px;
  text-align:center;
}

.collections-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:25px;
  margin-top:40px;
}

/* PRODUCT */
.product-card{
  background:var(--dark);
  padding:20px;
  border-radius:12px;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
}

.product-card:hover{
  transform:translateY(-5px);
}

.product-card img{
  width:100%;
  border-radius:10px;
  transition:0.4s;
}

.product-card img.back{
  position:absolute;
  top:20px;
  left:20px;
  opacity:0;
}

.product-card:hover img.front{
  opacity:0;
}

.product-card:hover img.back{
  opacity:1;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  padding:20px;
}

.modal.active{
  opacity:1;
  pointer-events:auto;
}

.modal img{
  max-width:300px;
  border-radius:10px;
}

.close-modal{
  position:absolute;
  top:20px;
  right:30px;
  font-size:2rem;
  cursor:pointer;
}

.sizes{
  display:flex;
  gap:10px;
  margin:15px 0;
}

.size{
  border:1px solid white;
  padding:8px 15px;
  cursor:pointer;
}

.size.active,
.size:hover{
  background:white;
  color:black;
}

.modal button{
  padding:10px 25px;
  border:none;
  cursor:pointer;
}

/* CART PANEL */
.cart-panel{
  position:fixed;
  top:0;
  right:-400px;
  width:350px;
  height:100%;
  background:#111;
  padding:20px;
  transition:0.4s;
  z-index:2000;
  overflow:auto;
}

.cart-panel.active{
  right:0;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cart-close{
  cursor:pointer;
  font-size:1.5rem;
}

.cart-item{
  margin:15px 0;
  border-bottom:1px solid #333;
  padding-bottom:10px;
}

.qty{
  display:flex;
  gap:10px;
  align-items:center;
  margin-top:5px;
}

.qty button{
  padding:3px 8px;
  cursor:pointer;
}

.total{
  margin-top:20px;
  font-weight:600;
}
</style>
</head>
<body>

<nav>
  <div class="logo">PRCSN.Co</div>
  <div class="cart-btn" onclick="toggleCart()">
    🛒 <span id="cart-count">0</span>
  </div>
</nav>

<header class="hero">
  <video autoplay muted loop>
    <source src="video.mp4" type="video/mp4">
  </video>
  <div>
    <h1>PRECISION</h1>
    <button onclick="scrollToSection('collections')">Shop Now</button>
  </div>
</header>

<section id="collections">
<h2>Collections</h2>

<div class="collections-grid">

<!-- ALL YOUR ORIGINAL PRODUCTS -->
<script>
const products = [
{img:'images/tshirt1.png',back:'images/tshirt1-back.png',title:'Black Minimalist Tee',price:25},
{img:'images/tshirt2.png',back:'images/tshirt2-back.png',title:'Blue Sharp Moves Tee',price:28},
{img:'images/tshirt3.png',back:'images/tshirt3-back.png',title:'Black Sharp Moves Tee',price:30},
{img:'images/tshirt4.png',back:'images/tshirt4-back.png',title:'T-Shirt 4',price:32},
{img:'images/tshirt5.png',back:'images/tshirt5-back.png',title:'T-Shirt 5',price:32},
{img:'images/tshirt6.png',back:'images/tshirt6-back.png',title:'T-Shirt 6',price:34},
{img:'images/tshirt7.png',back:'images/tshirt7-back.png',title:'T-Shirt 7',price:34},
];
</script>

<div id="product-container"></div>

</div>
</section>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="close-modal" onclick="closeModal()">✕</div>
<img id="modal-img">
<h3 id="modal-title"></h3>
<p id="modal-price"></p>

<p style="color:#aaa;margin-top:10px;">
Premium 100% cotton. Relaxed fit.<br>
Model is 6'0 wearing size L.<br>
Ships in 2–4 business days.
</p>

<div class="sizes">
<div class="size" onclick="selectSize(this)">S</div>
<div class="size" onclick="selectSize(this)">M</div>
<div class="size" onclick="selectSize(this)">L</div>
<div class="size" onclick="selectSize(this)">XL</div>
</div>

<button onclick="addToCart()">Add to Cart</button>
</div>

<!-- CART -->
<div class="cart-panel" id="cart-panel">
<div class="cart-header">
<h2>Your Cart</h2>
<div class="cart-close" onclick="toggleCart()">←</div>
</div>
<div id="cart-items"></div>
<div class="total" id="cart-total"></div>
</div>

<script>
const container=document.getElementById("product-container");

products.forEach((p,i)=>{
container.innerHTML+=`
<div class="product-card" onclick="openModal(${i})">
<img src="${p.img}" class="front">
<img src="${p.back}" class="back">
<h3>${p.title}</h3>
<p>$${p.price}</p>
</div>`;
});

let cart=[];
let selectedSize=null;
let currentProduct=null;

function openModal(index){
currentProduct=products[index];
document.getElementById("modal-img").src=currentProduct.img;
document.getElementById("modal-title").innerText=currentProduct.title;
document.getElementById("modal-price").innerText="$"+currentProduct.price;
document.getElementById("modal").classList.add("active");
}

function closeModal(){
document.getElementById("modal").classList.remove("active");
selectedSize=null;
document.querySelectorAll(".size").forEach(s=>s.classList.remove("active"));
}

function selectSize(el){
document.querySelectorAll(".size").forEach(s=>s.classList.remove("active"));
el.classList.add("active");
selectedSize=el.innerText;
}

function addToCart(){
if(!selectedSize){alert("Select a size");return;}

cart.push({...currentProduct,size:selectedSize,qty:1});
updateCart();
closeModal();
}

function updateCart(){
let items=document.getElementById("cart-items");
items.innerHTML="";
let total=0;

cart.forEach((item,index)=>{
total+=item.price*item.qty;
items.innerHTML+=`
<div class="cart-item">
${item.title} (${item.size}) - $${item.price}
<div class="qty">
<button onclick="changeQty(${index},-1)">-</button>
${item.qty}
<button onclick="changeQty(${index},1)">+</button>
<button onclick="removeItem(${index})">✕</button>
</div>
</div>`;
});

document.getElementById("cart-total").innerText="Total: $"+total;
document.getElementById("cart-count").innerText=cart.length;
}

function changeQty(index,amount){
cart[index].qty+=amount;
if(cart[index].qty<=0) cart.splice(index,1);
updateCart();
}

function removeItem(index){
cart.splice(index,1);
updateCart();
}

function toggleCart(){
document.getElementById("cart-panel").classList.toggle("active");
}

function scrollToSection(id){
document.getElementById(id).scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
